---
- name: Deploy Nginx, static site and node_exporter (reproducible IaC)
  hosts: webservers
  become: true
  vars:
    nginx_site_name: "diplom-site"
    nginx_root_path: "/var/www/diplom"
    node_exporter_version: "1.6.0"

  tasks:
    # === Репозитории и APT ===
    - name: Configure Yandex mirror (main + updates only)
      copy:
        content: |
          deb http://mirror.yandex.ru/debian/ bullseye main contrib non-free
          deb http://mirror.yandex.ru/debian/ bullseye-updates main contrib non-free
        dest: /etc/apt/sources.list
        owner: root
        group: root
        mode: '0644'

    - name: Force refresh APT indexes
      shell: |
        apt-get clean
        rm -rf /var/lib/apt/lists/*
        apt-get update
      args:
        executable: /bin/bash
      changed_when: false

    # === Nginx ===
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Create document root directory
      file:
        path: "{{ nginx_root_path }}"
        state: directory
        mode: '0755'

    - name: Deploy index.html
      copy:
        content: |
          <html>
            <head><title>Diplom IaC Project</title></head>
            <body>
              <h1>Hello from web1 via Ansible!</h1>
              <p>Infrastructure: Terraform + Yandex Cloud</p>
              <p>Automation: Ansible via bastion node</p>
            </body>
          </html>
        dest: "{{ nginx_root_path }}/index.html"
        mode: '0644'

    - name: Configure Nginx virtual host
      copy:
        content: |
          server {
            listen 80;
            server_name _;
            root {{ nginx_root_path }};
            index index.html;

            location / {
              try_files $uri $uri/ =404;
            }
          }
        dest: "/etc/nginx/sites-available/{{ nginx_site_name }}"
        mode: '0644'

    - name: Enable site
      file:
        src: "/etc/nginx/sites-available/{{ nginx_site_name }}"
        dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}"
        state: link

    - name: Disable default site
      file:
        path: "/etc/nginx/sites-enabled/default"
        state: absent

    - name: Validate Nginx config
      command: nginx -t
      register: nginx_test
      changed_when: false
      failed_when: "'failed' in nginx_test.stderr or 'error' in nginx_test.stderr"

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted

    - name: Verify site returns HTTP 200
      uri:
        url: "http://127.0.0.1"
        return_content: false
        status_code: 200
      register: site_check
      changed_when: false
      ignore_errors: true

    - name: Show site check result
      debug:
        msg: "Site check: {{ site_check.status | default('N/A') }} — {{ 'OK' if site_check.status == 200 else 'FAILED' }}"

    # === Node Exporter ===
    - name: Create node_exporter user
      user:
        name: node_exporter
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/node_exporter
        create_home: false

    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
        mode: '0644'

    - name: Extract node_exporter
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp"
        remote_src: yes
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

    - name: Copy node_exporter binary to /usr/local/bin
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        remote_src: yes
        owner: root
        group: root
        mode: '0755'

    - name: Reload systemd and enable node_exporter
      systemd:
        name: node_exporter
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Wait for node_exporter to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9100
        delay: 5
        timeout: 30
      changed_when: false

    - name: Verify node_exporter returns valid metrics
      uri:
        url: "http://127.0.0.1:9100/metrics"
        return_content: false
        status_code: 200
      register: node_exporter_check
      changed_when: false
      ignore_errors: true

    - name: Show node_exporter check result
      debug:
        msg: "node_exporter status: {{ 'OK' if node_exporter_check.status == 200 else 'FAILED' }}"

---
- name: Run backup on web1
  hosts: web1
  become: true
  roles:
    - backup
